<div class="orden-compra">
  <!-- Fila de encabezados de columna. -->
  <div class="orden-fila orden-encabezado">
    <span>Nombre</span>
    <span>Cant.</span>
    <span>Precio</span>
    <span>Proveedor</span>
    <span>Total</span>
  </div>

  <!-- @for repite el bloque una vez por elemento de la lista.
       `track` le dice a Angular cómo identificar cada elemento para actualizar solo lo que cambia. -->
  @for (item of items(); track item.nombre) {
    <div class="orden-fila">
      <span>{{ item.nombre }}</span>
      <span>{{ item.cantidad }}</span>
      <!-- toFixed(2) muestra siempre 2 decimales (por ejemplo 12.50). -->
      <span>{{ item.precio.toFixed(2) }}</span>
      <span>{{ item.proveedor }}</span>
      <!-- Total de la línea = cantidad × precio. -->
      <span>{{ (item.cantidad * item.precio).toFixed(2) }}</span>
    </div>
  }

  <button type="button" class="btn-cancelar">CANCELAR</button>

  <div class="orden-total">
    <span>Precio total</span>
    <strong>{{ total().toFixed(2) }}</strong>
  </div>

  <button type="button" class="btn-pagar">{{ textoBoton() }}</button>
</div>
